# ============================================
# GitHub Actions - CI Pipeline
# ============================================
# Runs on: push to main/develop, pull requests
# Checks: linting, type checking, tests
# ============================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------
  # Linting & Type Checking
  # ----------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jarvis-backend/requirements.txt
          pip install -r jarvis-backend/requirements-dev.txt 2>/dev/null || true

      - name: Run Ruff (Linting)
        run: |
          ruff check jarvis-backend/

      - name: Run Ruff (Format Check)
        run: |
          ruff format --check jarvis-backend/

      - name: Run Pyright (Type Checking)
        run: |
          pip install pyright
          pyright jarvis-backend/

  # ----------------------------
  # Unit Tests
  # ----------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jarvis_test
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jarvis-backend/requirements.txt
          pip install -r jarvis-backend/requirements-dev.txt 2>/dev/null || true

      - name: Run pytest
        env:
          DATABASE_URL: postgresql+asyncpg://jarvis:test@localhost:5432/jarvis_test
          UPSTASH_REDIS_REST_URL: ""
          SUPABASE_URL: ""
          SUPABASE_ANON_KEY: ""
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          TELEGRAM_BOT_TOKEN: ""
        run: |
          pytest jarvis-backend/tests/ -v --cov=app --cov-report=term-missing

  # ----------------------------
  # Security Audit
  # ----------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Bandit (Security)
        uses: seanmiddleditch/bandit@latest
        with:
          directory: './jarvis-backend'
          exclude: './tests'
          level: 1

      - name: Check for secrets
        uses: trufflesecurity/trufflehog@latest
        with:
          path: ./
          base: main
          head: HEAD