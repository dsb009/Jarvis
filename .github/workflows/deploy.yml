# ============================================
# GitHub Actions - Deploy to GCP Cloud Run
# ============================================
# Runs on: manual trigger or push to main
# Deploys: API to Cloud Run, Worker to Cloud Run Job
# ============================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

  push:
    branches: [main]

jobs:
  # ----------------------------
  # Deploy API
  # ----------------------------
  deploy-api:
    name: Deploy API to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud Run
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy API
        env:
          IMAGE_TAG: gcr.io/${{ secrets.GCP_PROJECT_ID }}/jarvis-api:${{ github.sha }}
        run: |
          # Build
          gcloud builds submit \
            --tag $IMAGE_TAG \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --config infrastructure/docker/cloudbuild.yaml \
            jarvis-backend/

          # Deploy
          gcloud run deploy jarvis-api \
            --image $IMAGE_TAG \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars="\
              SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
              SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }},\
              UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},\
              UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }},\
              GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }},\
              TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Update Telegram Webhook
        run: |
          API_URL=$(gcloud run services describe jarvis-api --platform managed --region ${{ secrets.GCP_REGION }} --format 'value(status.url)' --project ${{ secrets.GCP_PROJECT_ID }})
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/setWebhook" \
            -d "url=${API_URL}/webhook"

  # ----------------------------
  # Deploy Worker
  # ----------------------------
  deploy-worker:
    name: Deploy Worker to Cloud Run Job
    runs-on: ubuntu-latest
    needs: deploy-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud Run
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy Worker
        env:
          IMAGE_TAG: gcr.io/${{ secrets.GCP_PROJECT_ID }}/jarvis-worker:${{ github.sha }}
        run: |
          # Build
          gcloud builds submit \
            --tag $IMAGE_TAG \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --config infrastructure/docker/cloudbuild-worker.yaml \
            jarvis-backend/

          # Create/update Job
          gcloud run jobs deploy jarvis-worker \
            --image $IMAGE_TAG \
            --platform managed \
            --region ${{ secrets.GCP_REGION }} \
            --set-env-vars="\
              SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
              SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }},\
              UPSTASH_REDIS_REST_URL=${{ secrets.UPSTASH_REDIS_REST_URL }},\
              UPSTASH_REDIS_REST_TOKEN=${{ secrets.UPSTASH_REDIS_REST_TOKEN }},\
              GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},\
              OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --project ${{ secrets.GCP_PROJECT_ID }}

  # ----------------------------
  # Notify on Success
  # ----------------------------
  notify:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-worker]
    if: always()

    steps:
      - name: Send Discord Notification
        if: needs.deploy-api.result == 'success'
        run: |
          curl -X POST '${{ secrets.DISCORD_WEBHOOK }}' \
            --data-raw '{"content": "✅ JARVIS deployed successfully! \\n Commit: ${{ github.sha }}"}'

      - name: Send Discord Notification (Failure)
        if: needs.deploy-api.result == 'failure'
        run: |
          curl -X POST '${{ secrets.DISCORD_WEBHOOK }}' \
            --data-raw '{"content": "❌ JARVIS deployment failed! \\n Check logs: https://github.com/${{ github.repository }}/actions"}'